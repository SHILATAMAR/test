<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=shield,bolt,arrow_forward_ios,travel,wifi_tethering,description,vital_signs,help" />
</head>

<body>

    <header>
        <span class="material-symbols-outlined" id="HeadIcon">
            shield
        </span>
        <p> SIGING OPS </p>
        <button id="btn"> • SECURE • ONLINE </button>
    </header>

    <section id="sec1">
        <div class='radar'>
            <div class='sweep'></div>
            <span class="blip blip-1"></span>
            <span class="blip blip-2"></span>
            <span class="blip blip-3"></span>
        </div>

        <div class="TextContainer">
            <div class="TextBox">
                <span class="SNumber">24</span>
                <span class="TextLabel">ACTIVE SIGNALS</span>
            </div>

            <div class="stat-box">
                <span class="SNumber">07</span>
                <span class="TextLabel">PRIORITY ASSETS</span>
            </div>
        </div>
    </section>

    <div id="button">
        <button class="btnn"><span class="material-symbols-outlined">
                bolt
            </span> New Brief </button>
        <button class="btnn">
            <span class="material-symbols-outlined">
                arrow_forward_ios
            </span> Decode
        </button>
        <button class="btnn"><span class="material-symbols-outlined">
                travel
            </span> Request Drone </button>
    </div>

    <section id="sec2">
        <div id="card1" class="card">
            <div class="line">
                <button> CRITICAL </button>
                <p> In progress </p>
            </div>
            <h3> Operation Nightfall </h3>
            <progress id="file" max="100" value="65">65%</progress>
            <label for="file"> 65% </label>
        </div>

        <div id="card2" class="card">
            <div class="line">
                <button> HIGH </button>
                <p> Analyzing </p>
            </div>
            <h3> Signal Intercept Alpha </h3>
            <progress id="file" max="100" value="40">40%</progress>
            <label for="file"> 40% </label>
        </div>

        <div id="card3" class="card">
            <div class="line">
                <button> MEDIUM </button>
                <p> Pending </p>
            </div>
            <h3> Asset Recovry </h3>
            <progress id="file" max="100" value="15">15%</progress>
            <label for="file"> 15% </label>
        </div>

        <div id="card4" class="card">
            <div class="line">
                <button> HIGH </button>
                <p> Active </p>
            </div>
            <h3> Cyber Defense Grid </h3>
            <progress id="file" max="100" value="80">80%</progress>
            <label for="file"> 80% </label>
        </div>
    </section>

    <div id="warn"> THREAT DETECTED </div>

    <footer>
        <a class="footerItem">
            <span class="material-symbols-outlined">
                vital_signs
            </span>
            <p> Deshboard </p>
        </a>
        <a class="footerItem">
            <span class="material-symbols-outlined">
                wifi_tethering
            </span>
            <p> Feed </p>
        </a>
        <a class="footerItem">
            <span class="material-symbols-outlined">
                description
            </span>
            <p> Brief </p>
        </a>
        <span class="material-symbols-outlined">
            help
        </span>
    </footer>
</body>

</html>
